<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <span class="navbar-brand">
            Smart Expense Tracker
        </span>

        <form th:action="@{/logout}" method="post">

            <button class="btn btn-danger">
                Logout
            </button>

        </form>

    </div>

</nav>

<div class="container mt-4">

    <div class="card shadow mb-4">

        <div class="card-header">

            <h4>Add Expense</h4>

        </div>

        <div class="card-body">

            <form th:action="@{/expenses}"
                  th:object="${expense}"
                  method="post">
                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <div class="col-md-3">

                        <input
                                class="form-control"
                                type="text"
                                th:field="*{title}"
                                placeholder="Title"
                                required>

                    </div>

                    <div class="col-md-3">

                        <input
                                class="form-control"
                                type="text"
                                th:field="*{category}"
                                placeholder="Category"
                                required>

                    </div>

                    <div class="col-md-2">

                        <input
                                class="form-control"
                                type="number"
                                step="0.01"
                                th:field="*{amount}"
                                placeholder="Amount"
                                required>

                    </div>

                    <div class="col-md-2">

                        <input
                                class="form-control"
                                type="date"
                                th:field="*{expenseDate}"
                                required>

                    </div>

                    <div class="col-md-2">

                        <button
                                class="btn btn-primary w-100"
                                type="submit">

                            Save

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

    <div class="card shadow">

        <div class="card-header">

            <h4>All Expenses</h4>

        </div>

        <div class="card-body">

            <table class="table table-striped">

                <thead>

                <tr>

                    <th>Title</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Date</th>
                    <th>Actions</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="expense : ${expenses}">

                    <td th:text="${expense.title}"></td>
                    <td th:text="${expense.category}"></td>
                    <td th:text="${expense.amount}"></td>
                    <td th:text="${expense.expenseDate}"></td>
                    <td>
                        <a class="btn btn-warning btn-sm"
                           th:href="@{/expenses/edit/{id}(id=${expense.id})}">

                            Edit

                        </a>

                        <a class="btn btn-danger btn-sm"
                           th:href="@{/expenses/delete/{id}(id=${expense.id})}">

                            Delete

                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
